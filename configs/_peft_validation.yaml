# Minimal config to validate the real PEFT/PyTorch (MPS) training path with a
# tiny HF model. Not a real distillation run — proves the backend mechanics work.
name: _peftval
seed: 42
output_root: experiments

teacher:
  model: qwen3.5:2b
  generation:
    max_tokens: 128
    think: false

dataset:
  prompts_path: prompts/seed_prompts.jsonl
  generations_path: outputs/_peftval/gen.jsonl
  train_path: outputs/_mlxval/train.jsonl   # reuse the 3 real chat samples
  val_path: null
  format: chat

student:
  model: HuggingFaceTB/SmolLM2-135M-Instruct   # tiny, fast on MPS
  backend: peft
  lora:
    rank: 8
    alpha: 16.0
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    num_layers: -1

training:
  learning_rate: 0.0002
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 2
  max_seq_length: 256
  checkpoint_interval: 2
  eval_interval: 100
  log_interval: 1

evaluation:
  metrics: [bleu, rouge]
  num_samples: 3
  report_path: outputs/_peftval/report.html
